<!DOCTYPE html>
<html lang="en">

<head>
  <style>
    body {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      cursor: url("shuttle.cur") 16 16, auto;
    }
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Krish's Universe</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <audio id="bgAudio" src="sound.mp3" loop>
  <p>If you are reading this, it is because your browser does not support the audio element.</p>
  </audio>

  <!-- Mute / Unmute Button -->
  <button id="audioToggle" class="audio-btn">🔊 Mute</button>


  <!-- Universe -->
  <main id="space" class="space">

  <!-- Planet 1 -->
  <div class="planet-container p1-pos">
    <img src="assets/p1.png" id="p1"class="planet" width="180">
  </div>

  <!-- Planet 2 -->
  <div class="planet-container p2-pos">
    <img src="assets/p2.png" id="p2"class="planet" width="120">
  </div>

  <!-- Planet 3 -->
  <div class="planet-container p3-pos">
    <img src="assets/p3.png" id="p3"class="planet" width="120">
  </div>

  <!-- Planet 4 -->
  <div class="planet-container p4-pos">
    <img src="assets/p4.png" id="p4" class="planet" width="140">
  </div>

  <!-- Planet 5 -->
  <div class="planet-container p5-pos">
    <img src="assets/p5.png" id="p5" class="planet" width="180">
  </div>

  <!-- Planet 6 -->
  <div class="planet-container p6-pos">
    <img src="assets/p6.png" id="p6" class="planet" width="170">
  </div>

  <!-- Planet 7 -->
  <div class="planet-container p7-pos">
    <img src="assets/p7.png" id="p7" class="planet" width="130">
  </div>

  </main>

  Shader / spaceship cursor
  <canvas id="shaderCanvas"></canvas> 

  <div id="modal" class="modal hidden">
  <div class="modal-content">
    <button id="closeModal">✕</button>
    <h2 id="modalTitle">Planet Name</h2>
    <p id="modalText">Description goes here.</p>
    <button id="exploreBtn">Explore ↓</button>
    <div id="modalDetails" class="hidden">
      <p id="modalDetailsText"></p>
      <div id="modalImages"></div>
    </div>
  </div>
  </div>

<script src="js/planet.js"></script>

</body>
</html>
